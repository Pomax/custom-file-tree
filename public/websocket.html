<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>File-tree demo</title>
    <script src="./drag-drop-touch.esm.js?autoload" type="module"></script>
    <link rel="stylesheet" href="../dist/file-tree.css" async />
    <script src="touch-simulation.js" type="module" async></script>
    <script src="index-ws.js" type="module" async></script>
    <link rel="stylesheet" href="index.css" async />
    <style>
      #split {
        display: flex;
        flex-direction: row;
        file-tree {
          width: fit-content;
        }
        textarea {
          margin-left: 1em;
          width: 50%;
          min-height: 100vh;
        }
      }
    </style>
  </head>

  <body>
    <h2>The element, with a websocket connection:</h2>

    <div id="split">
      <file-tree
        show-top-level="true"
        remove-empty-dir="true"
        websocket
      ></file-tree>
      <textarea id="editor"></textarea>
    </div>
  </body>
</html>
